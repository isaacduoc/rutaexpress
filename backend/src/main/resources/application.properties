server.port=8080

# -----------------------------------------------------------------------------
# SEGURIDAD E IDENTIDAD (Azure AD - IDaaS)
# -----------------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/d4e45c2c-5598-4953-9517-f1c5f09d4eb1/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=c515cc67-aed4-4210-89f0-433271797592

# -----------------------------------------------------------------------------
# BASE DE DATOS ORACLE
# -----------------------------------------------------------------------------

# Oracle Free local en Docker
# Service Name: FREEPDB1
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}

# Usuario exclusivo para el microservicio de envíos
spring.datasource.username=${ORACLE_USERNAME:rutaexpress_shipments}
spring.datasource.password=${ORACLE_PASSWORD:RutaExpress123}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola para depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# CONFIGURACIÓN RABBITMQ
# -----------------------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# -----------------------------------------------------------------------------
# CONFIGURACIÓN KAFKA
# -----------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

app.kafka.topic.shipments-events=shipments.events