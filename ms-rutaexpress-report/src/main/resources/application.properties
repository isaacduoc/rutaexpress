server.port=8085

spring.application.name=ms-rutaexpress-report

# -----------------------------------------------------------------------------
# BASE DE DATOS ORACLE
# -----------------------------------------------------------------------------

spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USERNAME:rutaexpress_report}
spring.datasource.password=${ORACLE_PASSWORD:RutaExpress123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# CONFIGURACIÓN KAFKA
# -----------------------------------------------------------------------------

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=report-service-v2
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.duoc.ms_rutaexpress_report.event.ShipmentEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
app.kafka.topic.shipments-events=shipments.events