
server.port=8083

spring.application.name=ms-rutaexpress-catalog

# -----------------------------------------------------------------------------
# BASE DE DATOS ORACLE
# -----------------------------------------------------------------------------

spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USERNAME:rutaexpress_catalog}
spring.datasource.password=${ORACLE_PASSWORD}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------------
# RABBITMQ - CATALOG
# --------------------------------------------------

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Confirmacion manual de mensajes
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=5

# Cola que consume Catalog desde RabbitMQ
rutaexpress.rabbitmq.queue.warehouse=q.cmd.warehouse